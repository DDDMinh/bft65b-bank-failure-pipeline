# BFT65B Pipeline Configuration (Single Source of Truth)
project:
  name: "bft65b-bank-failure-pipeline"
  random_seed: 42

paths:
  raw_dir: "data_raw/fdic"
  processed_dir: "data_processed"
  outputs_dir: "outputs"
  tables_dir: "outputs/tables"
  figures_dir: "outputs/figures"
  manifests_dir: "outputs/manifests"

acquisition:
  api_base_url: "https://api.fdic.gov/banks"
  field_dictionary_url: "https://api.fdic.gov/banks/docs/risview_properties.yaml"
  failure_dictionary_url: "https://api.fdic.gov/banks/docs/failure_properties.yaml"
  institution_dictionary_url: "https://api.fdic.gov/banks/docs/institution_properties.yaml"
  fields_config: "configs/fdic_fields.yaml"
  metadata_dir: "data_raw/fdic/_metadata"
  manifest_path: "data_raw/fdic/_manifests/acquisition_manifest.json"
  log_dir: "data_raw/fdic/_logs"
  page_size: 10000
  pause_seconds: 1.0
  max_retries: 6
  request_timeout_seconds: 180
  backoff_base_seconds: 2.0
  backoff_cap_seconds: 60.0
  backoff_jitter_seconds: 1.0
  retry_quarter_attempts: 2
  user_agent: "BFT65B-bank-failure-pipeline/0.1 (academic project)"
  full_start_date: "1984-03-31"
  full_end_date: "2026-06-30"
  sample_start_date: "2023-03-31"
  sample_end_date: "2023-12-31"
  parquet_compression: "zstd"
  parquet_row_group_size: 65536

modelling:
  label_horizon_quarters: 4
  modelling_cutoff_date: "2025-06-30"   # Mandatory: later labels are incomplete
  min_gap_quarters: 4                   # Mandatory: >= 4 quarters between dev and test
  min_test_failures: 50                 # Mandatory: >= 50 failures in test period
  # Confirm exact split dates after Phase 1 & Phase 2 empirical failure-by-year audit:
  dev_start_date: "1984-03-31"
  dev_end_date: "2008-12-31"
  test_start_date: "2010-03-31"         # Leaves 2009Q1-2009Q4 (4 full quarters) gap
  test_end_date: "2025-06-30"
  cv_embargo_quarters: 4
  test_evaluation_locked: false         # Set true after freezing model & threshold

benchmark:
  warmup_runs: 1
  timed_runs: 5
  spark_shuffle_partitions: 8

# Phase 2 rulebook and artifact paths. Audit statistics are report-only; none
# of these outputs are model parameters or preprocessing state.
quality:
  exit_codes_config: "configs/exit_codes.yaml"
  processed_quality_dir: "data_processed/quality"
  processed_panel_dir: "data_processed/panel"
  bank_exit_status_path: "data_processed/quality/bank_exit_status.parquet"
  bank_event_log_path: "data_processed/quality/bank_event_log.parquet"
  bank_failure_events_path: "data_processed/quality/bank_failure_events.parquet"
  bank_quarter_exclusions_path: "data_processed/quality/bank_quarter_exclusions.parquet"
  panel_path: "data_processed/panel/bank_quarter.parquet"
  panel_schema_path: "outputs/manifests/panel_schema.json"
  summary_path: "outputs/manifests/quality_summary.json"
  audit_report_path: "outputs/tables/dq_audit_report.csv"
  rule_catalogue_path: "outputs/tables/dq_rule_catalogue.csv"
  missingness_field_path: "outputs/tables/dq_missingness_by_field.csv"
  missingness_era_path: "outputs/tables/dq_missingness_by_era.csv"
  accounting_examples_path: "outputs/tables/dq_accounting_examples.csv"
  extremes_triage_path: "outputs/tables/dq_extremes_triage.csv"
  exit_summary_path: "outputs/tables/exit_taxonomy_summary.csv"
  exit_reconciliation_path: "outputs/tables/exit_reconciliation.csv"
  exit_examples_path: "outputs/tables/exit_case_examples.csv"
  duplicate_policy: "error"   # error | keep-first
  parquet_compression: "zstd"
  parquet_row_group_size: 65536
  era_boundaries:
    pre_risk_based_end: "1989-12-31"
    risk_based_end: "2000-12-31"
    past_due_available_end: "2009-12-31"
    post_crisis_end: "2019-12-31"
  missingness_flag_fields:
    - RBCRWAJ
    - RBC1RWAJ
    - RBC1AAJ
    - RBCT1J
    - P3ASSET
    - P9ASSET
    - NAASSET
    - NTLNLS
    - NUMEMP
    - OFFDOM
    - DEPUNINS
    - ELNATR
    - TRADE

report:
  # Page-1 identity fields are deliberately empty until the student supplies them.
  # Never invent these values; README and reporting/page1_metadata.py read them here.
  author_name: ""
  student_id: ""
  github_url: ""
