# BFT65B Pipeline Configuration (Single Source of Truth)
project:
  name: "bft65b-bank-failure-pipeline"
  random_seed: 42

paths:
  raw_dir: "data_raw/fdic"
  processed_dir: "data_processed"
  outputs_dir: "outputs"
  tables_dir: "outputs/tables"
  figures_dir: "outputs/figures"
  manifests_dir: "outputs/manifests"

acquisition:
  api_base_url: "https://api.fdic.gov/banks"
  field_dictionary_url: "https://api.fdic.gov/banks/docs/risview_properties.yaml"
  failure_dictionary_url: "https://api.fdic.gov/banks/docs/failure_properties.yaml"
  institution_dictionary_url: "https://api.fdic.gov/banks/docs/institution_properties.yaml"
  fields_config: "configs/fdic_fields.yaml"
  metadata_dir: "data_raw/fdic/_metadata"
  manifest_path: "data_raw/fdic/_manifests/acquisition_manifest.json"
  log_dir: "data_raw/fdic/_logs"
  page_size: 10000
  pause_seconds: 1.0
  max_retries: 6
  request_timeout_seconds: 180
  backoff_base_seconds: 2.0
  backoff_cap_seconds: 60.0
  backoff_jitter_seconds: 1.0
  retry_quarter_attempts: 2
  user_agent: "BFT65B-bank-failure-pipeline/0.1 (academic project)"
  full_start_date: "1984-03-31"
  full_end_date: "2026-06-30"
  sample_start_date: "2023-03-31"
  sample_end_date: "2023-12-31"
  parquet_compression: "zstd"
  parquet_row_group_size: 65536

modelling:
  label_horizon_quarters: 4
  modelling_cutoff_date: "2025-06-30"   # Mandatory: later labels are incomplete
  min_gap_quarters: 4                   # Mandatory: >= 4 quarters between dev and test
  min_test_failures: 50                 # Mandatory: >= 50 failures in test period
  # Phase 4 empirical failure tabulation confirmed this split. The four full
  # quarters from 2009Q1-2009Q4 are explicitly labelled split="gap" and are
  # excluded from both development training and the single test evaluation.
  dev_start_date: "1984-03-31"
  dev_end_date: "2008-12-31"
  test_start_date: "2010-03-31"
  test_end_date: "2025-06-30"
  cv_embargo_quarters: 4
  test_evaluation_locked: false         # Set true after freezing model & threshold

benchmark:
  warmup_runs: 1
  timed_runs: 5
  spark_shuffle_partitions: 8
  spark_driver_memory: "3g"
  memory_sample_interval_seconds: 0.02

# Phase 3 workload, equivalence, plans, and scaling benchmark. The shared
# workload reads the Phase 2 panel; failure metadata is joined only for a
# report-only row-count diagnostic and no failure-derived column is exported.
processing:
  processed_dir: "data_processed/processing"
  sample_input_path: "data_processed/processing/sample_workload.parquet"
  scale_inputs_dir: "data_processed/processing/scale_inputs"
  outputs_dir: "data_processed/processing/outputs"
  input_manifest_path: "outputs/manifests/processing_inputs.json"
  processing_manifest_path: "outputs/manifests/processing_manifest.json"
  polars_plans_path: "outputs/tables/polars_plans.txt"
  spark_plan_path: "outputs/tables/spark_physical_plan.txt"
  spark_plan_interpretation_path: "outputs/tables/spark_plan_interpretation.md"
  equivalence_report_path: "outputs/tables/engine_equivalence_report.csv"
  equivalence_summary_path: "outputs/manifests/engine_equivalence_summary.json"
  benchmark_results_path: "outputs/tables/benchmark_results.csv"
  benchmark_summary_path: "outputs/manifests/benchmark_summary.json"
  benchmark_figure_path: "outputs/figures/engine_runtime_memory.png"
  cluster_crossover_path: "outputs/tables/cluster_crossover.csv"
  cluster_crossover_note_path: "outputs/tables/cluster_crossover_note.md"
  scales: [10, 25, 50, 100]
  lookback_quarters: 4
  numeric_rtol: 1.0e-6
  numeric_atol: 1.0e-8
  parquet_compression: "zstd"
  parquet_row_group_size: 65536
  # Spark's dictionary encoder can retain one hash entry per distinct double in
  # a row group; disable it for the wide float output on the full panel.
  spark_parquet_dictionary_enabled: false

# Phase 4 label, CAMELS feature, split, and train-only preprocessing contract.
# Feature artifacts are stored per scope under data_processed/features; the
# frozen column lists and coverage audit are exported to feature_summary.json.
features:
  processed_dir: "data_processed/features"
  preprocessor_path: "data_processed/features/preprocessor_dev.joblib"
  dictionary_path: "outputs/tables/feature_dictionary.csv"
  summary_path: "outputs/manifests/feature_summary.json"
  preprocessing_fit_path: "outputs/manifests/preprocessing_fit.json"
  label_audit_path: "outputs/tables/label_audit.csv"
  filing_lag_audit_path: "outputs/tables/label_filing_lag_audit.csv"
  failures_by_quarter_path: "outputs/tables/failures_by_quarter.csv"
  split_audit_path: "outputs/tables/split_audit.csv"
  sample_lookback_start_date: "2022-03-31"  # Gives 2023Q1 an exact 4Q lag seed
  sample_output_start_date: "2023-03-31"
  sample_output_end_date: "2023-12-31"
  clipping_lower_quantile: 0.01
  clipping_upper_quantile: 0.99
  imputation_strategy: "median"
  scale_features: true
  parquet_compression: "zstd"
  parquet_row_group_size: 65536

# Phase 2 rulebook and artifact paths. Audit statistics are report-only; none
# of these outputs are model parameters or preprocessing state.
quality:
  exit_codes_config: "configs/exit_codes.yaml"
  processed_quality_dir: "data_processed/quality"
  processed_panel_dir: "data_processed/panel"
  bank_exit_status_path: "data_processed/quality/bank_exit_status.parquet"
  bank_event_log_path: "data_processed/quality/bank_event_log.parquet"
  bank_failure_events_path: "data_processed/quality/bank_failure_events.parquet"
  bank_quarter_exclusions_path: "data_processed/quality/bank_quarter_exclusions.parquet"
  panel_path: "data_processed/panel/bank_quarter.parquet"
  panel_schema_path: "outputs/manifests/panel_schema.json"
  summary_path: "outputs/manifests/quality_summary.json"
  audit_report_path: "outputs/tables/dq_audit_report.csv"
  rule_catalogue_path: "outputs/tables/dq_rule_catalogue.csv"
  missingness_field_path: "outputs/tables/dq_missingness_by_field.csv"
  missingness_era_path: "outputs/tables/dq_missingness_by_era.csv"
  accounting_examples_path: "outputs/tables/dq_accounting_examples.csv"
  extremes_triage_path: "outputs/tables/dq_extremes_triage.csv"
  exit_summary_path: "outputs/tables/exit_taxonomy_summary.csv"
  exit_reconciliation_path: "outputs/tables/exit_reconciliation.csv"
  exit_examples_path: "outputs/tables/exit_case_examples.csv"
  duplicate_policy: "error"   # error | keep-first
  parquet_compression: "zstd"
  parquet_row_group_size: 65536
  era_boundaries:
    pre_risk_based_end: "1989-12-31"
    risk_based_end: "2000-12-31"
    past_due_available_end: "2009-12-31"
    post_crisis_end: "2019-12-31"
  missingness_flag_fields:
    - RBCRWAJ
    - RBC1RWAJ
    - RBC1AAJ
    - RBCT1J
    - P3ASSET
    - P9ASSET
    - NAASSET
    - NTLNLS
    - NUMEMP
    - OFFDOM
    - DEPUNINS
    - ELNATR
    - TRADE

report:
  # Page-1 identity fields are deliberately empty until the student supplies them.
  # Never invent these values; README and reporting/page1_metadata.py read them here.
  author_name: ""
  student_id: ""
  github_url: ""
