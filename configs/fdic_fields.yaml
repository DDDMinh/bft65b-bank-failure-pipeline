# Frozen Phase 1 field registry.
#
# The starter script's 33 financial fields are the mandatory core. Seven
# reserve fields are retained for Phase 4 feature selection. Fields are typed
# explicitly so that early-quarter nulls and pre-Basel zeroes can never change
# the Parquet schema.
#
# Units are declared here because the FDIC RISVIEW dictionary does not publish
# an x-number-unit for most financial fields. The dictionary gate reconciles
# every declaration with metadata where metadata is available and records the
# provenance in outputs/tables/field_dictionary.csv.
version: 1

tables:
  financials:
    endpoint: financials
    sort_by: CERT
    key_fields: [CERT, REPDTE]
    fields:
      CERT:
        dtype: int64
        role: key
        unit: identifier
      REPDTE:
        dtype: date32
        role: key
        unit: date
        source_format: "%Y%m%d"
      STNAME:
        dtype: string
        role: context
        unit: text
      ASSET:
        dtype: float64
        role: feature_candidate
        unit: usd_thousands
