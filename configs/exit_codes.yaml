# Frozen FDIC CHANGEC1 taxonomy used by Phase 2.
#
# `description` is recorded only when the meaning was verified from the FDIC
# change-code documentation. Undocumented codes are retained with
# `documented: false` and are classified from observed table behaviour, never
# from an invented definition. The failures table always overrides CHANGEC1.
version: 1

categories:
  failure_resolution: "FDIC receivership, payoff, or other recorded failure resolution"
  assisted_merger: "Assisted merger; failure status still comes from the Failures table"
  merger_absorption: "Merger, absorption, consolidation, or affiliation without failure"
  partial_or_unknown_exit: "Partial transaction or exit with no verified terminal meaning"
  voluntary_closure: "Voluntary closing"
  non_terminal_admin: "Administrative or structural change that does not end reporting"
  unknown: "Code not documented in the cached FDIC change-code subset"

codes:
  "110":
    description: null
    category: unknown
    documented: false
    terminal_hint: false
